<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AROM Enterprise — Laser Data Center</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .splash-screen {
      position: fixed;
      inset: 0;
      background-color: #0f172a;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- SPLASH SCREEN (15 SONIYA) -->
  <div id="splash" class="splash-screen">
    <div class="w-full max-w-sm bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-2xl text-center">
      <img src="IMG_20260903_124949_586.jpg" alt="AROM Swing" class="w-full h-auto rounded-xl object-cover mb-4 border border-slate-700">
      <h2 class="text-xl font-bold text-white mb-1">AROM Enterprise</h2>
      <p class="text-xs text-slate-400 mb-4">Laser Cutting Data Center yuklanmoqda...</p>
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-700 rounded-full h-2 mb-3 overflow-hidden">
        <div id="progress-bar" class="bg-amber-500 h-2 rounded-full transition-all duration-1000 ease-linear" style="width: 0%"></div>
      </div>
      <p id="timer-text" class="text-xs font-semibold text-amber-400">Tizim tayyorlanmoqda: 15 sek</p>
    </div>
  </div>

  <!-- ASOSIY MINI APP BO'LIMI -->
  <div id="main-app" class="hidden p-4 max-w-md mx-auto">
    <div class="text-center my-4">
      <h1 class="text-2xl font-black text-amber-500">⚙️ AROM LASER DATA CENTER</h1>
      <p class="text-xs text-slate-400 mt-1">TruLaser / Tube Laser Ishlab Chiqarish Boshqaruvi</p>
    </div>

    <!-- TUGMALAR BLOKI -->
    <div class="space-y-3 mt-6">
      <button onclick="sendReport('today')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
        <span>📊 Kunlik Hisobotni Guruhga Yuborish</span>
      </button>

      <button onclick="sendReport('week')" class="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
        <span>📅 Haftalik Hisobot</span>
      </button>

      <button onclick="sendReport('month')" class="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
        <span>🗓 Oylik Hisobot</span>
      </button>

      <button onclick="sendReport('6months')" class="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
        <span>📈 6 Oylik Hisobot</span>
      </button>

      <button onclick="sendReport('year')" class="w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
        <span>📋 1 Yillik Hisobot</span>
      </button>
    </div>

    <div class="mt-8 text-center border-t border-slate-800 pt-4">
      <p class="text-[10px] text-slate-500">AROM Enterprise © 2026 | Barcha huquqlar himoyalangan</p>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let timeLeft = 15;
    const progressBar = document.getElementById('progress-bar');
    const timerText = document.getElementById('timer-text');
    const splash = document.getElementById('splash');
    const mainApp = document.getElementById('main-app');

    const countdown = setInterval(() => {
      timeLeft--;
      const percentage = ((15 - timeLeft) / 15) * 100;
      progressBar.style.width = percentage + '%';
      timerText.innerText = Tizim tayyorlanmoqda: ${timeLeft} sek;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        splash.style.display = 'none';
        mainApp.classList.remove('hidden');
      }
    }, 1000);

    function sendReport(period) {
      const payload = {
        action: 'generate_report_pdf',
        period: period
      };
      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Telegram WebApp muhiti topilmadi!");
      }
    }
  </script>
</body>
</html>
